[project]
name = "finance-io"
version = "0.1.0"
description = "Aplicação acadêmica de gestão financeira pessoal"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.162.2",
    "psycopg[binary]>=3.3.8",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.8",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.coverage.run]
source = ["finance_io.backend"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
