name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        # uuidv7() usado nos server_default exige PostgreSQL 18.
        image: postgres:18
        env:
          POSTGRES_USER: finance_ci
          POSTGRES_PASSWORD: finance_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # O banco de testes é criado e migrado pelo tests/conftest.py.
      TEST_DATABASE_URL: postgresql+psycopg://finance_ci:finance_ci@localhost:5432/finance_test
      DATABASE_URL: postgresql+psycopg://finance_ci:finance_ci@localhost:5432/finance_dev
      JWT_SECRET_TOKEN: ci-dummy-secret-not-used-in-production-0123456789
      # Os testes usam fakeredis; estes valores só satisfazem o Settings.
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_USER: ci
      REDIS_PASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar Python (.python-version)
        run: uv python install

      - name: Instalar dependências
        run: uv sync --locked

      - name: Rodar testes
        run: uv run pytest --cov=finance_io.backend --cov-report=term-missing
